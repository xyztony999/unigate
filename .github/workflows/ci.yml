name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: unigate_test
          POSTGRES_USER: unigate
          POSTGRES_PASSWORD: unigate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unigate -d unigate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UNIGATE_TEST_DB_URL: postgres://localhost:5432/unigate_test
      UNIGATE_TEST_DB_USER: unigate
      UNIGATE_TEST_DB_PASSWORD: unigate_test
    steps:
      - uses: actions/checkout@v4
      # Go 版本以 backend/go.mod 的 go 指令为准; setup-go 默认缓存 go mod 下载
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # OpenAPI 合同与 SQL 迁移均已内嵌进二进制(go:embed), 无外部构建依赖
      - name: Go gate (build + vet + unit/PostgreSQL integration tests)
        working-directory: backend
        run: go build ./... && go vet ./... && go test ./...

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      # build 已包含类型检查
      - run: npm --prefix frontend run build
