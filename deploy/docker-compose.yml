# 服务器端 PostgreSQL。与根目录 compose.yaml 同源, 增加自启策略;
# 由 /opt/unigate/.env 提供 UNIGATE_DB_PASSWORD(仅服务器, 不入库)。
# 只监听本机; 后端二进制与 psql 备份均经 127.0.0.1 访问。
name: unigate
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unigate
      POSTGRES_USER: unigate
      POSTGRES_PASSWORD: ${UNIGATE_DB_PASSWORD:?Set UNIGATE_DB_PASSWORD in /opt/unigate/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unigate -d unigate"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
