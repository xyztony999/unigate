# UniGate 站点 Nginx 配置模板(宝塔: 网站 → 配置文件, 用以下内容替换 server 块)。
# 替换 unigate.example.com 为实际域名; 证书路径是宝塔申请证书后的默认位置。
# 若 Nginx 非 宝塔 安装, 将 server 块放入对应 vhost 配置。

server {
    listen 80;
    listen 443 ssl http2;
    server_name unigate.example.com;

    ssl_certificate     /www/server/panel/vhost/cert/unigate.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/unigate.example.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP 全部跳转 HTTPS(相机扫码与 Secure Cookie 都要求 HTTPS)
    if ($scheme = http) { return 301 https://$host$request_uri; }

    root /www/wwwroot/unigate;
    index index.html;

    # 名单导入(CSV/XLSX)上传上限, 略高于后端 multipart 上限 11MB
    client_max_body_size 12m;

    # API: 原样转发到本机后端, 不重写路径(后端上下文即 /api/v1)
    location /api/ {
        # 端口与 unigate.env 的 PORT 保持一致(本部署 8080 被占, 用 8090)
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 私密接口不得缓存
        add_header Cache-Control "no-store" always;
    }

    # Vite 产物带内容指纹, 可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由全部回退到 index.html; 入口本身不缓存
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
