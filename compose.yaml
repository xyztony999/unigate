name: unigate
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: unigate
      POSTGRES_USER: unigate
      POSTGRES_PASSWORD: ${UNIGATE_DB_PASSWORD:?Set UNIGATE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unigate -d unigate"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
