server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: ${UNIGATE_DB_URL:jdbc:postgresql://localhost:5432/unigate}
    username: ${UNIGATE_DB_USER:unigate}
    password: ${UNIGATE_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
unigate:
  master-key: ${UNIGATE_MASTER_KEY:}
  cookie-secure: ${UNIGATE_COOKIE_SECURE:true}
  allowed-origin: ${UNIGATE_ALLOWED_ORIGIN:http://localhost:5173}
  bootstrap-username: ${UNIGATE_BOOTSTRAP_USERNAME:admin}
  bootstrap-password: ${UNIGATE_BOOTSTRAP_PASSWORD:}
